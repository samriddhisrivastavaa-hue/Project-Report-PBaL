<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SMS Organizer &amp; Classifier</title>
<style>
  :root {
    --personal: #64748b;
    --promotional: #f59e0b;
    --otp: #3b82f6;
    --transaction: #10b981;
    --service: #8b5cf6;
    --danger: #ef4444;
    --bg: #f8fafc;
    --card: #ffffff;
    --text: #1e293b;
    --muted: #64748b;
    --border: #e2e8f0;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  header {
    background: linear-gradient(135deg, #4f46e5, #7c3aed);
    color: white;
    padding: 20px 24px;
  }
  header h1 { margin: 0; font-size: 22px; }
  header p { margin: 4px 0 0; opacity: 0.9; font-size: 14px; }
  .wrap { max-width: 820px; margin: 0 auto; padding: 20px 16px 60px; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 18px;
    margin-bottom: 18px;
  }
  .card h2 { margin: 0 0 12px; font-size: 16px; }
  label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 4px; margin-top: 10px; }
  input, textarea {
    width: 100%;
    padding: 9px 10px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 14px;
    font-family: inherit;
  }
  textarea { resize: vertical; min-height: 70px; }
  button {
    cursor: pointer;
    border: none;
    border-radius: 8px;
    padding: 10px 16px;
    font-size: 14px;
    font-weight: 600;
    margin-top: 12px;
    margin-right: 8px;
  }
  .btn-primary { background: #4f46e5; color: white; }
  .btn-secondary { background: #e2e8f0; color: var(--text); }
  .btn-danger { background: #fee2e2; color: #b91c1c; }
  .btn-small { padding: 6px 10px; font-size: 12px; margin-top: 0; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; }
  .row > div { flex: 1; min-width: 160px; }
  .hidden { display: none !important; }
  .error { color: #b91c1c; font-size: 13px; margin-top: 8px; }
  .muted { color: var(--muted); font-size: 13px; }
  .badge {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 700;
    color: white;
    text-transform: uppercase;
    letter-spacing: 0.3px;
  }
  .badge.personal { background: var(--personal); }
  .badge.promotional { background: var(--promotional); }
  .badge.otp { background: var(--otp); }
  .badge.transaction { background: var(--transaction); }
  .badge.service { background: var(--service); }
  .badge.phishing { background: var(--danger); }
  .stats { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
  .stat {
    flex: 1;
    min-width: 100px;
    background: var(--bg);
    border-radius: 10px;
    padding: 12px;
    text-align: center;
  }
  .stat .num { font-size: 22px; font-weight: 700; }
  .stat .lbl { font-size: 11px; color: var(--muted); text-transform: uppercase; }
  .tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
  .tab {
    padding: 6px 12px;
    border-radius: 999px;
    background: var(--bg);
    font-size: 12px;
    cursor: pointer;
    border: 1px solid var(--border);
  }
  .tab.active { background: #4f46e5; color: white; border-color: #4f46e5; }
  .msg {
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px;
    margin-bottom: 10px;
  }
  .msg .top { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
  .msg .sender { font-weight: 700; font-size: 13px; }
  .msg .body { font-size: 13px; margin-top: 6px; color: #334155; white-space: pre-wrap; }
  .result-box {
    margin-top: 12px;
    padding: 12px;
    border-radius: 8px;
    background: var(--bg);
    display: none;
  }
  .result-box.show { display: block; }
  .userbar { display: flex; justify-content: space-between; align-items: center; }
  #toast {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: #1e293b;
    color: white;
    padding: 10px 18px;
    border-radius: 8px;
    font-size: 13px;
    display: none;
    z-index: 50;
  }
</style>
</head>
<body>

<header>
  <h1>📱 SMS Organizer &amp; Classifier</h1>
  <p>Auto-categorizes messages into Personal, Promotional, OTP, Transaction &amp; Service — and flags phishing</p>
</header>

<div class="wrap">

  <!-- Quick classify demo - works without login -->
  <div class="card">
    <h2>🔎 Live Classify Demo</h2>
    <p class="muted">Koi bhi SMS text yahan paste karo aur dekho turant kaunsi category mein jaata hai — ismein login ki zaroorat nahi.</p>
    <textarea id="quickText" placeholder="e.g. Your OTP is 4821. Do not share this with anyone."></textarea>
    <button class="btn-primary" onclick="quickClassify()">Classify Now</button>
    <div id="quickResult" class="result-box"></div>
  </div>

  <!-- Auth -->
  <div class="card" id="authCard">
    <h2 id="authTitle">Login</h2>
    <div class="row">
      <div>
        <label>Email</label>
        <input id="authEmail" type="email" placeholder="you@example.com" />
      </div>
      <div>
        <label>Password</label>
        <input id="authPassword" type="password" placeholder="••••••••" />
      </div>
    </div>
    <button class="btn-primary" onclick="doLogin()">Login</button>
    <button class="btn-secondary" onclick="doSignup()">Sign Up</button>
    <button class="btn-secondary" onclick="demoLogin()">⚡ One-click Demo Account</button>
    <div id="authError" class="error"></div>
  </div>

  <!-- Dashboard -->
  <div class="card hidden" id="dashboardCard">
    <div class="userbar">
      <h2 style="margin:0">📊 Dashboard</h2>
      <div>
        <button class="btn-secondary btn-small" onclick="loadSampleMessages()">➕ Load Sample Messages</button>
        <button class="btn-secondary btn-small" onclick="reclassifyAll()">🔄 Reclassify</button>
        <button class="btn-danger btn-small" onclick="logout()">Logout</button>
      </div>
    </div>

    <div class="stats" id="statsRow"></div>
    <div class="tabs" id="tabsRow"></div>
    <div id="messagesList"></div>
  </div>

</div>

<div id="toast"></div>

<script src="app.js"></script>
</body>
</html>
